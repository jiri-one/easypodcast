name: App

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EasyPodcast-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - run: flutter build linux --release
      - run: tar -C build/linux/x64/release/bundle -czf build/EasyPodcast-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: EasyPodcast-linux-x64
          path: app/build/EasyPodcast-linux-x64.tar.gz
          if-no-files-found: error
