name: Server

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: easypodcast
          POSTGRES_PASSWORD: test
          POSTGRES_DB: easypodcast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easypodcast -d easypodcast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EASYPODCAST_TEST_DATABASE_URL: postgres://easypodcast:test@127.0.0.1:5432/easypodcast_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jiri-one/easypodcast:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
