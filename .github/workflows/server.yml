name: Server

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: easypodcast
          POSTGRES_PASSWORD: test
          POSTGRES_DB: easypodcast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easypodcast -d easypodcast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EASYPODCAST_TEST_DATABASE_URL: postgres://easypodcast:test@127.0.0.1:5432/easypodcast_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: server-image-${{ github.ref }}
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check whether this commit should publish
        id: publish
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            latest=$(git ls-remote --exit-code origin "$GITHUB_REF")
            if [[ "${latest%%$'\t'*}" != "$GITHUB_SHA" ]]; then
              exit 0
            fi
          fi
          echo 'image=true' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.publish.outputs.image == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.publish.outputs.image == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.publish.outputs.image == 'true'
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jiri-one/easypodcast:${{ github.ref_name }}
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
